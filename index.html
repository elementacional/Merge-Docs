<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suíte Unificada de Mesclagem de Documentos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip para manipulação de DOCX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- pdf-lib para manipulação e mesclagem de PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <!-- SortableJS para reordenação -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .file-item { transition: all 0.2s ease; }
        .file-item:hover { transform: translateX(4px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 flex flex-col justify-between">

    <div class="max-w-2xl mx-auto w-full">
        <!-- Header -->
        <div class="mb-6 text-center">
            <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Unificador de Documentos</h1>
            <p class="text-slate-600 text-sm">Mescle arquivos .docx ou PDFs em um único documento de forma local e segura.</p>
        </div>

        <!-- Abas de Navegação -->
        <div class="flex justify-center mb-6 space-x-2 bg-slate-200/70 p-1.5 rounded-2xl max-w-xs mx-auto">
            <button id="tabDocx" onclick="switchMode('docx')" class="flex-1 py-2 text-xs font-bold rounded-xl transition gradient-bg text-white shadow-md">Mesclar .DOCX</button>
            <button id="tabPdf" onclick="switchMode('pdf')" class="flex-1 py-2 text-xs font-bold rounded-xl transition bg-white text-slate-600 hover:text-slate-900 shadow-sm">Mesclar .PDF</button>
        </div>

        <!-- Card Principal -->
        <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 overflow-hidden">
            <!-- Dropzone Area -->
            <div id="dropzone" class="p-6 border-b border-slate-100">
                <input type="file" id="fileInput" multiple class="hidden">
                <label for="fileInput" id="dropzone-label" class="flex flex-col items-center justify-center w-full py-10 border-2 border-dashed border-indigo-200 rounded-2xl cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/50 transition">
                    <div class="mb-3 text-indigo-500">
                        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    </div>
                    <span id="dropzone-text" class="text-sm font-semibold text-slate-700">Clique ou arraste arquivos .docx aqui</span>
                    <span class="text-xs text-slate-400 mt-1">Processamento 100% no navegador</span>
                </label>
            </div>

            <!-- Lista Ordenável -->
            <ul id="fileList" class="p-4 space-y-2 min-h-[100px] max-h-72 overflow-y-auto">
                <li id="emptyState" class="text-slate-400 text-center text-sm py-8 italic">Nenhum arquivo adicionado ainda.</li>
            </ul>

            <!-- Botão de Ação -->
            <div class="p-6 bg-slate-50 border-t border-slate-100">
                <button id="mergeBtn" disabled class="w-full gradient-bg text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-500/30 hover:opacity-90 transition disabled:opacity-50 disabled:cursor-not-allowed">
                    Mesclar Documentos
                </button>
            </div>
        </div>
    </div>

    <footer class="text-center py-6 text-xs text-slate-400">
        Arquitetura Local Segura • Sem upload para servidores externos.
    </footer>

    <script>
        let currentMode = 'docx';
        const fileList = document.getElementById('fileList');
        const dropzone = document.getElementById('dropzone-label');
        const fileInput = document.getElementById('fileInput');
        const mergeBtn = document.getElementById('mergeBtn');
        const emptyState = document.getElementById('emptyState');
        const dropzoneText = document.getElementById('dropzone-text');
        
        let filesMap = new Map();

        const sortable = new Sortable(fileList, {
            animation: 150,
            ghostClass: 'bg-indigo-50',
            handle: '.drag-handle',
            filter: '#emptyState'
        });

        function switchMode(mode) {
            currentMode = mode;
            filesMap.clear();
            fileList.innerHTML = '<li id="emptyState" class="text-slate-400 text-center text-sm py-8 italic">Nenhum arquivo adicionado ainda.</li>';
            updateState();

            if (mode === 'docx') {
                document.getElementById('tabDocx').className = "flex-1 py-2 text-xs font-bold rounded-xl transition gradient-bg text-white shadow-md";
                document.getElementById('tabPdf').className = "flex-1 py-2 text-xs font-bold rounded-xl transition bg-white text-slate-600 hover:text-slate-900 shadow-sm";
                fileInput.accept = ".docx";
                dropzoneText.innerText = "Clique ou arraste arquivos .docx aqui";
            } else {
                document.getElementById('tabPdf').className = "flex-1 py-2 text-xs font-bold rounded-xl transition gradient-bg text-white shadow-md";
                document.getElementById('tabDocx').className = "flex-1 py-2 text-xs font-bold rounded-xl transition bg-white text-slate-600 hover:text-slate-900 shadow-sm";
                fileInput.accept = ".pdf";
                dropzoneText.innerText = "Clique ou arraste arquivos .pdf aqui";
            }
        }

        function updateState() {
            const hasFiles = filesMap.size > 0;
            mergeBtn.disabled = !hasFiles;
            if (emptyState && emptyState.parentElement) {
                emptyState.style.display = hasFiles ? 'none' : 'block';
            }
        }

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                const ext = file.name.split('.').pop().toLowerCase();
                const valid = currentMode === 'docx' ? ext === 'docx' : ext === 'pdf';

                if (valid) {
                    if (document.getElementById('emptyState')) {
                        document.getElementById('emptyState').remove();
                    }

                    const id = 'id_' + Math.random().toString(36).substr(2, 9);
                    filesMap.set(id, file);

                    const li = document.createElement('li');
                    li.id = id;
                    li.className = 'file-item flex items-center p-4 bg-white border border-slate-200 rounded-xl shadow-sm';
                    li.innerHTML = `
                        <div class="drag-handle cursor-grab mr-4 text-slate-300 hover:text-indigo-500" title="Arraste para reordenar">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        </div>
                        <div class="flex-grow truncate text-sm font-medium text-slate-700">${file.name}</div>
                        <button type="button" onclick="removeFile('${id}')" class="ml-3 text-slate-400 hover:text-red-500 transition" title="Remover">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    `;
                    fileList.appendChild(li);
                }
            });
            updateState();
        }

        window.removeFile = function(id) {
            filesMap.delete(id);
            const el = document.getElementById(id);
            if (el) el.remove();
            
            if (filesMap.size === 0) {
                const li = document.createElement('li');
                li.id = 'emptyState';
                li.className = 'text-slate-400 text-center text-sm py-8 italic';
                li.innerText = 'Nenhum arquivo adicionado ainda.';
                fileList.appendChild(li);
            }
            updateState();
        }

        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('border-indigo-500', 'bg-indigo-50'); });
        dropzone.addEventListener('dragleave', (e) => { e.preventDefault(); dropzone.classList.remove('border-indigo-500', 'bg-indigo-50'); });
        dropzone.addEventListener('drop', (e) => { 
            e.preventDefault(); 
            dropzone.classList.remove('border-indigo-500', 'bg-indigo-50'); 
            handleFiles(e.dataTransfer.files); 
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
            fileInput.value = '';
        });

        mergeBtn.addEventListener('click', async () => {
            const order = Array.from(fileList.children)
                .filter(li => li.id !== 'emptyState')
                .map(li => li.id);

            if (order.length === 0) return;

            mergeBtn.innerText = "Processando mesclagem...";
            mergeBtn.disabled = true;

            try {
                const filesToMerge = order.map(id => filesMap.get(id));

                if (currentMode === 'docx') {
                    const zip = new JSZip();
                    const firstFileBuffer = await filesToMerge[0].arrayBuffer();
                    const baseZip = await JSZip.loadAsync(firstFileBuffer);
                    const baseXml = await baseZip.file("word/document.xml").async("text");
                    
                    const parts = baseXml.split("<w:body>");
                    let newBody = parts[0] + "<w:body>";

                    for (let i = 0; i < filesToMerge.length; i++) {
                        const arrayBuffer = await filesToMerge[i].arrayBuffer();
                        const z = await JSZip.loadAsync(arrayBuffer);
                        const xml = await z.file("word/document.xml").async("text");
                        const bodyMatch = xml.match(/<w:body>(.*?)<\/w:body>/s);
                        if (bodyMatch && bodyMatch[1]) {
                            newBody += bodyMatch[1];
                        }
                    }
                    newBody += "</w:body>" + parts[1].split("</w:body>")[1];
                    baseZip.file("word/document.xml", newBody);

                    const blob = await baseZip.generateAsync({
                        type: "blob",
                        mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                    });
                    downloadFile(blob, "Documento_Mesclado.docx");

                } else {
                    const { PDFDocument } = PDFLib;
                    const mergedPdf = await PDFDocument.create();

                    for (let i = 0; i < filesToMerge.length; i++) {
                        const arrayBuffer = await filesToMerge[i].arrayBuffer();
                        const pdfDoc = await PDFDocument.load(arrayBuffer);
                        const copiedPages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
                        copiedPages.forEach((page) => mergedPdf.addPage(page));
                    }

                    const pdfBytes = await mergedPdf.save();
                    const blob = new Blob([pdfBytes], { type: "application/pdf" });
                    downloadFile(blob, "Documento_Mesclado.pdf");
                }

            } catch (error) {
                console.error(error);
                alert("Erro ao processar os arquivos. Verifique se estão íntegros e no formato correto.");
            } finally {
                mergeBtn.innerText = "Mesclar Documentos";
                mergeBtn.disabled = false;
            }
        });

        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
